<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CrawlBot · Vessel Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0b1420; --panel:#0f1d2e; --panel2:#132437; --border:#1e3349;
    --text:#dbe7f2; --muted:#7c93a8; --accent:#2fa8ff; --accent2:#22c55e;
    --danger:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;height:100vh;width:100vw;overflow:hidden;}

  /* Sidebar */
  #sidebar{width:340px;min-width:340px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;}
  #sidebar-header{padding:14px 16px;border-bottom:1px solid var(--border);}
  #sidebar-header h1{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px;}
  #sidebar-header h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);display:inline-block;box-shadow:0 0 6px var(--accent2);}
  #search{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px;outline:none;}
  #search:focus{border-color:var(--accent);}
  #stats{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
  #stats b{color:var(--text);}
  #vessel-list{flex:1;overflow-y:auto;}
  .vrow{padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;gap:2px;}
  .vrow:hover{background:var(--panel2);}
  .vrow.active{background:var(--panel2);border-left:3px solid var(--accent);}
  .vrow .name{font-size:13px;font-weight:600;color:var(--text);}
  .vrow .meta{font-size:11px;color:var(--muted);display:flex;gap:8px;}
  .badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;}
  .badge.moving{background:rgba(34,197,94,.15);color:var(--accent2);}
  .badge.anchored{background:rgba(245,158,11,.15);color:var(--warn);}
  .badge.stopped{background:rgba(124,147,168,.15);color:var(--muted);}
  #empty{padding:24px 16px;color:var(--muted);font-size:13px;text-align:center;}

  /* Map */
  #map-wrap{flex:1;position:relative;}
  #map{height:100%;width:100%;background:#0b1420;}
  #toolbar{position:absolute;top:12px;right:12px;z-index:1000;display:flex;gap:8px;}
  .btn{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:12px;cursor:pointer;}
  .btn:hover{background:var(--panel2);}
  .btn.active{border-color:var(--accent);color:var(--accent);}
  #status{position:absolute;bottom:10px;left:10px;z-index:1000;font-size:11px;color:var(--muted);background:rgba(15,29,46,.8);padding:4px 8px;border-radius:4px;}
  #legend{position:absolute;bottom:34px;left:10px;z-index:1000;font-size:11px;color:var(--text);background:rgba(15,29,46,.9);padding:8px 10px;border-radius:6px;border:1px solid var(--border);display:flex;flex-direction:column;gap:4px;}
  #legend .item{display:flex;align-items:center;gap:6px;}
  #legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

  /* Leaflet popup theming */
  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--text);border-radius:8px;}
  .leaflet-popup-tip{background:var(--panel);}
  .popup h3{margin:0 0 6px;font-size:14px;}
  .popup table{border-collapse:collapse;font-size:12px;}
  .popup td{padding:2px 6px 2px 0;color:var(--muted);vertical-align:top;}
  .popup td.v{color:var(--text);}
  .ship-icon{filter:drop-shadow(0 0 2px rgba(0,0,0,.6));}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1><span class="dot"></span> CrawlBot Vessel Tracker</h1>
      <input id="search" placeholder="Tìm theo tên / IMO / MMSI..." />
    </div>
    <div id="stats">Tổng: <b id="stat-total">0</b> &nbsp;|&nbsp; Đang chạy: <b id="stat-moving">0</b></div>
    <div id="vessel-list"><div id="empty">Đang tải dữ liệu...</div></div>
  </div>
  <div id="map-wrap">
    <div id="map"></div>
    <div id="toolbar">
      <button class="btn active" id="btn-auto">🔄 Auto-refresh: ON</button>
      <button class="btn" id="btn-refresh">↻ Refresh ngay</button>
    </div>
    <div id="status">Chưa tải dữ liệu</div>
    <div id="legend"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Helper dựng HTML CÓ ESCAPE — dùng chung với test src/interfaces/http/publicRendering.test.ts -->
<script src="render.js"></script>
<script>
// Mọi hàm dựng HTML nằm ở render.js: giá trị upstream luôn qua escapeHtml(),
// góc xoay luôn qua safeCourse() -> không có đường chèn HTML/JS từ dữ liệu tàu.
const {
  keyOf, vesselColor, isMoving,
  popupHtml, renderVesselRow, shipIconSvg, legendHtml,
} = window.CrawlBotRender;

// Data cập nhật mỗi 6–12h -> không cần refresh dày. 60s đủ để bắt vòng scan mới.
const REFRESH_MS = 60000;
const MAX_MARKERS = 3000; // trần marker/khung nhìn -> trình duyệt luôn mượt

// preferCanvas: vẽ marker lên 1 canvas duy nhất thay vì tạo DOM/SVG node cho
// từng tàu -> nhẹ hơn HÀNG CHỤC LẦN khi có vài nghìn tàu. Zoom sâu (>=8, ít
// tàu) mới dùng icon tam giác xoay theo hướng; zoom xa dùng chấm tròn canvas.
const map = L.map('map', { worldCopyJump: true, preferCanvas: true }).setView([37, -97], 4);
const DETAIL_ZOOM = 8; // >= mức này mới vẽ icon chi tiết (xoay theo hướng)
const canvasRenderer = L.canvas({ padding: 0.5 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19,
}).addTo(map);

const markers = new Map(); // key -> {marker, position}
let autoRefresh = true;
let refreshTimer = null;
let activeKey = null;

// Icon Leaflet lấy SVG từ render.js (đã chặn góc xoay rác) rồi bọc divIcon.
function shipIcon(p){
  const icon = shipIconSvg(p);
  return L.divIcon({
    className: 'ship-icon',
    html: icon.html,
    iconSize: icon.size,
    iconAnchor: icon.anchor,
  });
}

function renderList(positions){
  const listEl = document.getElementById('vessel-list');
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = positions.filter(p => {
    if (!q) return true;
    return [p.name, p.imo, p.mmsi].filter(Boolean).some(x => String(x).toLowerCase().includes(q));
  });

  document.getElementById('stat-total').textContent = positions.length;
  document.getElementById('stat-moving').textContent = positions.filter(isMoving).length;

  if (filtered.length === 0) {
    listEl.innerHTML = '<div id="empty">Không có tàu nào khớp / chưa có dữ liệu crawl.</div>';
    return;
  }

  // Chỉ dựng tối đa 300 dòng — sidebar không cần liệt kê vài nghìn tàu.
  const LIST_CAP = 300;
  const shown = filtered.slice(0, LIST_CAP);

  listEl.innerHTML = '';
  shown.forEach(p => {
    const k = keyOf(p);
    const row = document.createElement('div');
    row.className = 'vrow' + (k === activeKey ? ' active' : '');
    row.innerHTML = renderVesselRow(p);
    row.addEventListener('click', () => focusVessel(k));
    listEl.appendChild(row);
  });
  if (filtered.length > LIST_CAP) {
    const more = document.createElement('div');
    more.id = 'empty';
    more.textContent = `Hiển thị ${LIST_CAP}/${filtered.length} — zoom vào hoặc tìm kiếm để lọc.`;
    listEl.appendChild(more);
  }
}

function focusVessel(k){
  activeKey = k;
  const entry = markers.get(k);
  if (entry && entry.position.lat != null && entry.position.lon != null) {
    map.setView([entry.position.lat, entry.position.lon], Math.max(map.getZoom(), 9));
    entry.marker.openPopup();
  }
  renderList(lastPositions);
}

let lastPositions = [];

// Tạo marker phù hợp mức zoom: xa -> chấm tròn canvas (rẻ), gần -> icon xoay.
function makeMarker(p){
  const detail = map.getZoom() >= DETAIL_ZOOM;
  if (detail) {
    return L.marker([p.lat, p.lon], { icon: shipIcon(p) });
  }
  const moving = isMoving(p);
  return L.circleMarker([p.lat, p.lon], {
    renderer: canvasRenderer,
    radius: moving ? 4 : 3,
    color: '#0b1420', weight: 1,
    fillColor: vesselColor(p), fillOpacity: 0.9,
  });
}

let markerModeDetail = null; // nhớ chế độ đang vẽ để rebuild khi đổi zoom

function renderMarkers(positions){
  const detail = map.getZoom() >= DETAIL_ZOOM;
  // Đổi chế độ (chấm <-> icon) -> xoá sạch rồi vẽ lại (2 loại marker khác nhau).
  if (markerModeDetail !== null && markerModeDetail !== detail) {
    for (const [, entry] of markers) map.removeLayer(entry.marker);
    markers.clear();
  }
  markerModeDetail = detail;

  const seen = new Set();
  positions.forEach(p => {
    if (p.lat == null || p.lon == null) return;
    const k = keyOf(p);
    seen.add(k);
    if (markers.has(k)) {
      const entry = markers.get(k);
      entry.marker.setLatLng([p.lat, p.lon]);
      if (detail) entry.marker.setIcon(shipIcon(p));
      entry.position = p;
    } else {
      const marker = makeMarker(p).addTo(map);
      marker.bindPopup(popupHtml(p));
      marker.on('click', () => { activeKey = k; renderList(lastPositions); });
      markers.set(k, { marker, position: p });
    }
  });
  for (const [k, entry] of markers) {
    if (!seen.has(k)) {
      map.removeLayer(entry.marker);
      markers.delete(k);
    }
  }
}

function renderLegend(){
  // Legend là dữ liệu TĨNH của developer (màu + nhãn category), không có giá
  // trị upstream -> an toàn khi gán innerHTML.
  document.getElementById('legend').innerHTML = legendHtml();
}
renderLegend();

// Chỉ tải tàu TRONG KHUNG NHÌN hiện tại (bbox) + giới hạn số lượng. Ở quy mô
// 700k–1M tàu, đây là điểm mấu chốt giúp web mượt: không bao giờ tải/vẽ cả triệu.
async function loadPositions(){
  const statusEl = document.getElementById('status');
  try {
    statusEl.textContent = 'Đang tải...';
    const b = map.getBounds();
    const bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()]
      .map((n) => n.toFixed(4)).join(',');
    const res = await fetch(`/positions?bbox=${bbox}&limit=${MAX_MARKERS}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    lastPositions = data.positions || [];
    renderMarkers(lastPositions);
    renderList(lastPositions);
    const capped = lastPositions.length >= MAX_MARKERS ? ' (đã cắt — zoom vào để xem chi tiết)' : '';
    statusEl.textContent = `Cập nhật ${new Date().toLocaleTimeString('vi-VN')} · ${lastPositions.length} tàu trong khung nhìn${capped}`;
  } catch (err) {
    statusEl.textContent = `Lỗi tải dữ liệu: ${err.message}`;
  }
}

// Debounce: kéo/zoom bản đồ xong mới tải lại (đỡ gọi API liên tục).
let moveTimer = null;
map.on('moveend', () => {
  clearTimeout(moveTimer);
  moveTimer = setTimeout(loadPositions, 400);
});

document.getElementById('search').addEventListener('input', () => renderList(lastPositions));

document.getElementById('btn-refresh').addEventListener('click', loadPositions);

document.getElementById('btn-auto').addEventListener('click', (e) => {
  autoRefresh = !autoRefresh;
  e.target.textContent = `🔄 Auto-refresh: ${autoRefresh ? 'ON' : 'OFF'}`;
  e.target.classList.toggle('active', autoRefresh);
  if (autoRefresh) startAutoRefresh(); else stopAutoRefresh();
});

function startAutoRefresh(){
  stopAutoRefresh();
  refreshTimer = setInterval(loadPositions, REFRESH_MS);
}
function stopAutoRefresh(){
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = null;
}

loadPositions();
startAutoRefresh();
</script>
</body>
</html>
